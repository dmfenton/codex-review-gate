name: Codex review gate
run-name: 'Codex review gate PR #${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || 0 }}'

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to audit
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: codex-review-gate-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  enforce:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
        (github.event.action != 'edited' || github.event.changes.base.ref)) ||
      (github.event_name == 'pull_request_review' &&
        contains(fromJSON('["chatgpt-codex-connector","chatgpt-codex-connector[bot]"]'), github.event.review.user.login)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(fromJSON('["chatgpt-codex-connector","chatgpt-codex-connector[bot]"]'), github.event.comment.user.login)) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        (contains(fromJSON('["chatgpt-codex-connector","chatgpt-codex-connector[bot]"]'), github.event.comment.user.login) ||
          (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
            (contains(github.event.comment.body, '@codex review') ||
              contains(github.event.changes.body.from, '@codex review')))))
    uses: ./.github/workflows/codex-review-gate.yml
    with:
      pr_number: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
      runner_labels_json: '["ubuntu-latest"]'
