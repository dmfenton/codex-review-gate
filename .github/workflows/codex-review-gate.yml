name: Reusable Codex review gate

on:
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number to audit
        required: true
        type: string
      runner_labels_json:
        description: JSON array of runner labels
        required: false
        type: string
        default: '["ubuntu-latest"]'
      base_branch:
        description: Required pull request base branch
        required: false
        type: string
        default: main
permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read
  statuses: write

jobs:
  discover-base-prs:
    if: inputs.pr_number == '0' && github.event_name == 'push'
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    outputs:
      base_run_created_at: ${{ steps.discover.outputs.base_run_created_at }}
      pr_numbers: ${{ steps.discover.outputs.pr_numbers }}
    steps:
      - id: discover
        name: Discover open pull requests
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          retry_api() {
            local delay
            for delay in 1 2 4 8 16; do
              "$@" && return 0
              sleep "$delay"
            done
            return 1
          }

          base_run_created_at="$(retry_api gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          pulls="$(retry_api gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls?state=open&base=$BASE_BRANCH&per_page=100")"
          pr_numbers="$(jq -c --arg repository "$GITHUB_REPOSITORY" '
            [add[]
              | select((.head.repo.full_name // "") == $repository)
              | select((.user.login // "") != "dependabot[bot]")
              | .number]
            | unique
          ' <<<"$pulls")"
          printf 'base_run_created_at=%s\n' "$base_run_created_at" >> "$GITHUB_OUTPUT"
          printf 'pr_numbers=%s\n' "$pr_numbers" >> "$GITHUB_OUTPUT"
          printf '### Codex base discovery\n\nOpen PRs: %s\n' "$(jq length <<<"$pr_numbers")" >> "$GITHUB_STEP_SUMMARY"

  invalidate-base:
    needs: discover-base-prs
    if: inputs.pr_number == '0' && needs.discover-base-prs.outputs.pr_numbers != '[]'
    strategy:
      fail-fast: false
      matrix:
        pr_number: ${{ fromJSON(needs.discover-base-prs.outputs.pr_numbers) }}
    concurrency:
      group: codex-review-gate-${{ github.repository }}-pr-${{ matrix.pr_number }}
      cancel-in-progress: true
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    steps:
      - name: Invalidate review created before the base push
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
          BASE_RUN_CREATED_AT: ${{ needs.discover-base-prs.outputs.base_run_created_at }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr_number }}
        run: |
          set -Eeuo pipefail

          retry_api() {
            local delay
            for delay in 1 2 4 8 16; do
              "$@" && return 0
              sleep "$delay"
            done
            return 1
          }

          pr_data="$(retry_api gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          head_sha="$(jq -r '.head.sha // ""' <<<"$pr_data")"
          head_repository="$(jq -r '.head.repo.full_name // ""' <<<"$pr_data")"
          pr_state="$(jq -r '.state // ""' <<<"$pr_data")"
          pr_base="$(jq -r '.base.ref // ""' <<<"$pr_data")"
          pr_author="$(jq -r '.user.login // ""' <<<"$pr_data")"

          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || exit 0
          [[ "$head_repository" == "$GITHUB_REPOSITORY" ]] || exit 0
          [[ "$pr_state" == open && "$pr_base" == "$BASE_BRANCH" ]] || exit 0
          [[ "$pr_author" != 'dependabot[bot]' ]] || exit 0

          gate_status="$(retry_api gh api \
            "repos/$GITHUB_REPOSITORY/commits/$head_sha/statuses?per_page=100" \
            --jq '[.[] | select(.context == "Codex review gate")][0] // {}')"
          gate_run_id="$(jq -r '.target_url // "" | capture("/actions/runs/(?<id>[0-9]+)").id // ""' \
            <<<"$gate_status" 2>/dev/null || true)"
          if [[ "$gate_run_id" =~ ^[0-9]+$ ]]; then
            gate_run_created_at="$(retry_api gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$gate_run_id" --jq .created_at 2>/dev/null || true)"
            if [[ -n "$gate_run_created_at" && \
              ( "$gate_run_created_at" > "$BASE_RUN_CREATED_AT" || "$gate_run_created_at" == "$BASE_RUN_CREATED_AT" ) ]]; then
              printf '### Codex base invalidation\n\nPR #%s already has a newer gate result.\n' \
                "$PR_NUMBER" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          retry_api gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$head_sha" \
            -f state=failure \
            -f context='Codex review gate' \
            -f target_url="$run_url" \
            -f description='Base advanced; fresh exact-head review required' >/dev/null
          printf '### Codex base invalidation\n\nInvalidated PR #%s at %s.\n' \
            "$PR_NUMBER" "$head_sha" >> "$GITHUB_STEP_SUMMARY"

  audit:
    if: inputs.pr_number != '0'
    concurrency:
      group: codex-review-gate-${{ github.repository }}-pr-${{ inputs.pr_number }}
      cancel-in-progress: true
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    steps:
      - name: Audit exact-head Codex review
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
          GH_TOKEN: ${{ github.token }}
          MAX_REVIEW_ROUNDS: 2
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          # shellcheck disable=SC2016
          set -Eeuo pipefail

          head_sha=''
          finalized=false
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          retry_api() {
            local delay
            for delay in 1 2 4 8 16; do
              "$@" && return 0
              sleep "$delay"
            done
            return 1
          }

          publish_status() {
            local state="$1"
            local description="$2"
            retry_api gh api --method POST \
              "repos/$GITHUB_REPOSITORY/statuses/$head_sha" \
              -f state="$state" \
              -f context='Codex review gate' \
              -f target_url="$run_url" \
              -f description="$description" >/dev/null
          }

          fail_gate() {
            local message="$1"
            echo "::error::$message"
            printf '### Codex review gate: failed\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
              publish_status failure 'Exact-head Codex review is not ready' || true
            fi
            finalized=true
            exit 1
          }

          finalize_unexpected_failure() {
            local code=$?
            if (( code != 0 )) && [[ "$finalized" != true ]] && [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
              publish_status failure 'Codex review audit failed closed' || true
            fi
            exit "$code"
          }
          trap finalize_unexpected_failure EXIT

          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || fail_gate 'A positive pull request number is required.'
          pr_data="$(retry_api gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")" || \
            fail_gate "Pull request #$PR_NUMBER could not be read."
          head_sha="$(jq -r '.head.sha // ""' <<<"$pr_data")"
          base_sha="$(jq -r '.base.sha // ""' <<<"$pr_data")"
          head_repository="$(jq -r '.head.repo.full_name // ""' <<<"$pr_data")"
          head_ref="$(jq -r '.head.ref // ""' <<<"$pr_data")"
          pr_state="$(jq -r '.state // ""' <<<"$pr_data")"
          pr_base="$(jq -r '.base.ref // ""' <<<"$pr_data")"
          pr_author="$(jq -r '.user.login // ""' <<<"$pr_data")"

          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || fail_gate 'The current pull request head SHA is unavailable.'
          publish_status pending 'Auditing exact-head Codex review'

          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]] || fail_gate 'The current base SHA is unavailable.'
          [[ "$pr_state" == open ]] || fail_gate 'Only open pull requests can pass the gate.'
          [[ "$pr_base" == "$BASE_BRANCH" ]] || fail_gate "Pull request must target $BASE_BRANCH."
          [[ "$head_repository" == "$GITHUB_REPOSITORY" ]] || fail_gate 'Fork pull requests cannot use this privileged status gate.'
          [[ -n "$head_ref" ]] || fail_gate 'The current pull request head branch is unavailable.'
          [[ "$pr_author" != 'dependabot[bot]' ]] || fail_gate 'Dependabot pull requests require a separate read-only policy.'

          owner="${GITHUB_REPOSITORY%%/*}"
          repository="${GITHUB_REPOSITORY#*/}"
          replacement_data="$(retry_api gh api graphql \
            -F owner="$owner" -F name="$repository" -F oid="$head_sha" \
            -f query="query(\$owner: String!, \$name: String!, \$oid: GitObjectID!) {
              repository(owner: \$owner, name: \$name) {
                object(oid: \$oid) {
                  ... on Commit {
                    history(first: 100) {
                      pageInfo { hasNextPage }
                      nodes {
                        oid
                        associatedPullRequests(first: 100) {
                          pageInfo { hasNextPage }
                          nodes { number state mergedAt baseRefName headRefOid }
                        }
                      }
                    }
                  }
                }
              }
            }")" || fail_gate 'Pull requests associated with the current branch history could not be read.'
          replacement_truncated="$(jq --arg base_sha "$base_sha" '
            (.data.repository.object.history.nodes | map(.oid == $base_sha) | any) as $base_found
            | (.data.repository.object.history.pageInfo.hasNextPage and ($base_found | not)) or
              ([.data.repository.object.history.nodes[].associatedPullRequests.pageInfo.hasNextPage] | any)
          ' <<<"$replacement_data")" || fail_gate 'Replacement pull-request pagination could not be audited.'
          [[ "$replacement_truncated" == false ]] || \
            fail_gate 'Replacement pull-request history exceeded the fail-closed audit limit.'
          replaced_prs="$(jq --argjson current_pr "$PR_NUMBER" --arg base_sha "$base_sha" \
            --arg base "$BASE_BRANCH" '
              .data.repository.object.history.nodes as $history
              | ($history | map(.oid == $base_sha) | index(true)) as $base_index
              | [
                  $history[:($base_index // ($history | length))][]
                  | .oid as $commit_oid
                  | .associatedPullRequests.nodes[]?
                  | select(.number != $current_pr)
                  | select((.headRefOid // "") == $commit_oid)
                  | select((.baseRefName // "") == $base)
                  | select(.state == "CLOSED" and .mergedAt == null)
                  | .number
                ]
              | unique
            ' <<<"$replacement_data")" || fail_gate 'Associated pull requests could not be normalized.'
          closed_pr_pages="$(retry_api gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls?state=closed&base=$BASE_BRANCH&per_page=100")" || \
            fail_gate 'Closed pull requests could not be read for replacement-branch auditing.'
          rewritten_prs="$(jq --argjson current_pr "$PR_NUMBER" --arg head_ref "$head_ref" \
            --arg base "$BASE_BRANCH" '
              [add[]?
                | select(.number != $current_pr)
                | select((.base.ref // "") == $base)
                | select((.head.ref // "") == $head_ref)
                | select(.merged_at == null)
                | .number]
              | unique
            ' <<<"$closed_pr_pages")" || fail_gate 'Replacement branch identities could not be normalized.'
          replaced_prs="$(printf '%s\n%s\n' "$replaced_prs" "$rewritten_prs" | jq -sc 'add | unique')" || \
            fail_gate 'Replacement pull-request evidence could not be combined.'
          [[ "$(jq length <<<"$replaced_prs")" == 0 ]] || \
            fail_gate "Review-budget reset detected: current branch descends from head/base previously closed unmerged in PR(s) $(jq -r 'join(", ")' <<<"$replaced_prs"). Reopen the original pull request or ask the owner."

          issue_pages="$(retry_api gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100")" || \
            fail_gate 'Pull request conversation comments could not be read.'
          review_pages="$(retry_api gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100")" || \
            fail_gate 'Pull request reviews could not be read.'
          review_comment_pages="$(retry_api gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments?per_page=100")" || \
            fail_gate 'Pull request review comments could not be read.'
          reaction_pages="$(retry_api gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/reactions?per_page=100")" || \
            fail_gate 'Pull request reactions could not be read.'

          # A finding-free review now completes by editing the persistent summary
          # comment and adding a pull-request thumbs-up instead of creating a
          # review record. Bind both bot-owned signals to the same short time
          # window; the summary itself identifies the reviewed commit.
          clean_summary_reviews="$(printf '%s\n%s\n' "$issue_pages" "$reaction_pages" | jq -cs '
              .[0] as $issues
              | .[1] as $reactions
              | [
                  $issues | add[]?
                  | select((.user.login // "")
                      | IN("chatgpt-codex-connector", "chatgpt-codex-connector[bot]"))
                  | select(.body | contains("<!-- codex-pull-request-review-summary -->"))
                  | . as $summary
                  | (try (.body | capture(
                      "\\*\\*Completed\\*\\*[^\\n]*datetime=\\\"(?<started>[^\\\"]+)\\\"[^\\n]*\\|[[:space:]]*`(?<sha>[0-9a-fA-F]{7,40})`[[:space:]]*\\|"
                    )) catch {}) as $completion
                  | select(($completion.sha // "") != "")
                  | select(any($reactions | add[]?;
                      ((.user.login // "")
                        | IN("chatgpt-codex-connector", "chatgpt-codex-connector[bot]")) and
                      .content == "+1" and
                      .created_at >= $completion.started and
                      ((((.created_at | fromdateiso8601) -
                        ($summary.updated_at | fromdateiso8601)) | fabs) <= 300)))
                  | {
                      id, body: (.body // ""), occurred_at: (.updated_at // ""),
                      commit_id: $completion.sha, login: (.user.login // ""), kind: "summary"
                    }
                ]
            ')" || fail_gate 'Clean Codex review summary could not be normalized.'

          # shellcheck disable=SC2016
          codex_reviews="$(printf '%s\n%s\n%s\n' \
            "$issue_pages" "$review_pages" "$clean_summary_reviews" | jq -cs '
              .[0] as $issues
              | .[1] as $reviews
              | .[2] as $summaries
              |
              [
                ($issues | add[]? | {
                  id, body: (.body // ""), occurred_at: (.created_at // ""),
                  commit_id: "", login: (.user.login // ""), kind: "issue"
                }),
                ($reviews | add[]? | {
                  id, body: (.body // ""), occurred_at: (.submitted_at // ""),
                  commit_id: (.commit_id // ""), login: (.user.login // ""), kind: "review"
                }),
                ($summaries[]?)
              ]
              | map(select(.login | IN("chatgpt-codex-connector", "chatgpt-codex-connector[bot]")))
              | map(select(.kind != "issue" or
                  (.body | contains("<!-- codex-pull-request-review-summary -->") | not)))
              | map(select(.body | test("Codex Review"; "i")))
              | map(. + {
                  reviewed_ref: (
                    if (.commit_id // "") != "" then .commit_id
                    else (try (.body | capture(
                      "Reviewed commit:[^0-9a-fA-F]*(?<sha>[0-9a-fA-F]{7,40})"
                    ).sha) catch "")
                    end
                    | ascii_downcase
                  )
                })
              | map(select(.reviewed_ref | test("^[0-9a-f]{7,40}$")))
              | sort_by(.occurred_at, .id)
              | . as $records
              | map(. as $review
                  | select(.kind != "summary" or
                      ([$records[]
                        | select(.kind != "summary")
                        | . as $explicit
                        | select(
                            ($explicit.reviewed_ref | startswith($review.reviewed_ref)) or
                            ($review.reviewed_ref | startswith($explicit.reviewed_ref)))
                        | select((
                            (($explicit.occurred_at | fromdateiso8601) -
                              ($review.occurred_at | fromdateiso8601)) | fabs
                          ) <= 30)]
                        | length) == 0))
            ')" || fail_gate 'Codex review records could not be normalized.'

          latest_review="$(jq -c 'last // empty' <<<"$codex_reviews")"
          [[ -n "$latest_review" ]] || fail_gate 'No completed Codex review exists for this pull request.'
          review_rounds="$(jq 'length' <<<"$codex_reviews")"
          if (( review_rounds > MAX_REVIEW_ROUNDS )); then
            echo "::warning::Codex review budget exceeded: $review_rounds/$MAX_REVIEW_ROUNDS rounds. Evaluating the latest completed review without requiring another round."
          fi

          latest_review_id="$(jq -r '.id' <<<"$latest_review")"
          inline_findings="$(jq --argjson review_id "$latest_review_id" '
            [add[]?
              | select(.pull_request_review_id == $review_id)
              | select((.user.login // "") | IN("chatgpt-codex-connector", "chatgpt-codex-connector[bot]"))]
            | length
          ' <<<"$review_comment_pages")" || fail_gate 'Codex inline review comments could not be normalized.'
          blocking_findings="$(jq --argjson review_id "$latest_review_id" --argjson review "$latest_review" '
            [
              ($review
                | select((.body // "") | test("\\[(P0|P1)( Badge)?\\]"; "i"))),
              (add[]?
                | select(.pull_request_review_id == $review_id)
                | select((.user.login // "") | IN("chatgpt-codex-connector", "chatgpt-codex-connector[bot]"))
                | select((.body // "") | test("\\[(P0|P1)( Badge)?\\]"; "i")))
            ]
            | length
          ' <<<"$review_comment_pages")" || fail_gate 'Blocking Codex findings could not be normalized.'
          clean_review="$(jq -r --argjson inline_findings "$inline_findings" '
            (.body | test("Codex Review: Didn.t find any major issues"; "i")) or
            (.kind == "summary") or
            (.kind == "review" and $inline_findings == 0 and
              (.body | test("Here are some automated review suggestions for this pull request"; "i")))
          ' <<<"$latest_review")"

          reviewed_ref="$(jq -r '.reviewed_ref' <<<"$latest_review")"
          [[ "$reviewed_ref" =~ ^[0-9a-fA-F]{7,40}$ ]] || fail_gate 'The latest Codex review does not identify its reviewed commit.'
          reviewed_sha="$(retry_api gh api "repos/$GITHUB_REPOSITORY/commits/$reviewed_ref" --jq .sha 2>/dev/null || true)"
          review_outcome='exact-head clean review'
          if [[ "$reviewed_sha" == "$head_sha" ]]; then
            (( blocking_findings == 0 )) || \
              fail_gate "The latest Codex review contains $blocking_findings blocking P0/P1 finding(s)."
            if [[ "$clean_review" != true ]]; then
              review_outcome='exact-head advisory findings accepted'
            fi
          else
            (( inline_findings > 0 )) || \
              fail_gate "The latest Codex review has no findings and does not cover current head $head_sha."
            (( review_rounds >= MAX_REVIEW_ROUNDS )) || \
              fail_gate "The latest Codex review does not cover current head $head_sha. One final review round remains."
            compare_status="$(retry_api gh api \
              "repos/$GITHUB_REPOSITORY/compare/$reviewed_sha...$head_sha" --jq .status 2>/dev/null || true)"
            [[ "$compare_status" == ahead ]] || \
              fail_gate 'The current head is not a remediation descendant of the final reviewed commit.'
            review_outcome='final-round findings remediated'
          fi

          reviewed_at="$(jq -r '.occurred_at' <<<"$latest_review")"
          base_committed_at="$(retry_api gh api "repos/$GITHUB_REPOSITORY/commits/$base_sha" \
            --jq '.commit.committer.date // .commit.author.date')" || \
            fail_gate 'The current base commit time could not be read.'
          [[ "$reviewed_at" > "$base_committed_at" || "$reviewed_at" == "$base_committed_at" ]] || \
            fail_gate 'The base branch advanced after the latest Codex review.'

          current_pr="$(retry_api gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")" || \
            fail_gate 'Pull request state could not be revalidated.'
          current_head="$(jq -r '.head.sha // ""' <<<"$current_pr")"
          current_base="$(jq -r '.base.sha // ""' <<<"$current_pr")"
          current_state="$(jq -r '.state // ""' <<<"$current_pr")"
          [[ "$current_head" == "$head_sha" && "$current_base" == "$base_sha" && "$current_state" == open ]] || \
            fail_gate 'Pull request head, base, or state changed during the audit.'

          thread_data="$(retry_api gh api graphql \
            -F owner="$owner" -F name="$repository" -F number="$PR_NUMBER" \
            -f query="query(\$owner: String!, \$name: String!, \$number: Int!) {
              repository(owner: \$owner, name: \$name) {
                pullRequest(number: \$number) {
                  reviewThreads(first: 100) {
                    pageInfo { hasNextPage }
                    nodes {
                      isResolved
                      comments(first: 100) {
                        pageInfo { hasNextPage }
                        nodes { author { login } body }
                      }
                    }
                  }
                }
              }
            }")" || fail_gate 'Live review threads could not be read.'

          truncated="$(jq '
            [.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage,
             (.data.repository.pullRequest.reviewThreads.nodes[].comments.pageInfo.hasNextPage)]
            | any
          ' <<<"$thread_data")"
          [[ "$truncated" == false ]] || fail_gate 'Review-thread pagination exceeded the fail-closed audit limit.'

          unresolved_blocking="$(jq '
            [.data.repository.pullRequest.reviewThreads.nodes[]
              | select(.isResolved | not)
              | select(any(.comments.nodes[]?;
                  ((.author.login // "") | IN("chatgpt-codex-connector", "chatgpt-codex-connector[bot]")) and
                  ((.body // "") | test("\\[(P0|P1)( Badge)?\\]"; "i"))))]
            | length
          ' <<<"$thread_data")"
          (( unresolved_blocking == 0 )) || \
            fail_gate "$unresolved_blocking unresolved blocking Codex review thread(s) remain."

          if [[ "$review_outcome" == 'exact-head clean review' ]]; then
            publish_status success 'Exact-head Codex review is clean'
          elif [[ "$review_outcome" == 'exact-head advisory findings accepted' ]]; then
            publish_status success 'Exact-head review has advisory findings only'
          else
            publish_status success 'Final review findings are remediated'
          fi
          finalized=true
          printf '### Codex review gate: passed\n\n- PR: #%s\n- Head: %s\n- Base: %s\n- Review rounds: %s/%s\n- Outcome: %s\n- Blocking findings: %s\n- Unresolved blocking Codex threads: 0\n' \
            "$PR_NUMBER" "$head_sha" "$base_sha" "$review_rounds" "$MAX_REVIEW_ROUNDS" \
            "$review_outcome" "$blocking_findings" >> "$GITHUB_STEP_SUMMARY"

  reconcile-threads:
    if: inputs.pr_number == '0' && github.event_name != 'push'
    concurrency:
      group: codex-review-gate-${{ github.repository }}-thread-reconcile
      cancel-in-progress: true
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    steps:
      - name: Fail heads with unresolved blocking Codex threads
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          retry_api() {
            local delay
            for delay in 1 2 4 8 16; do
              "$@" && return 0
              sleep "$delay"
            done
            return 1
          }

          publish_failure() {
            local head_sha="$1"
            local description="$2"
            local run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            retry_api gh api --method POST \
              "repos/$GITHUB_REPOSITORY/statuses/$head_sha" \
              -f state=failure \
              -f context='Codex review gate' \
              -f target_url="$run_url" \
              -f description="$description" >/dev/null
          }

          pulls="$(retry_api gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls?state=open&base=$BASE_BRANCH&per_page=100")"
          owner="${GITHUB_REPOSITORY%%/*}"
          repository="${GITHUB_REPOSITORY#*/}"
          failed=0
          invalidated=0

          while IFS=$'\t' read -r pr_number head_sha head_repository author; do
            [[ -n "$pr_number" ]] || continue
            [[ "$head_repository" == "$GITHUB_REPOSITORY" ]] || continue
            [[ "$author" != 'dependabot[bot]' ]] || continue
            [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || continue

            thread_data="$(retry_api gh api graphql \
              -F owner="$owner" -F name="$repository" -F number="$pr_number" \
              -f query="query(\$owner: String!, \$name: String!, \$number: Int!) {
                repository(owner: \$owner, name: \$name) {
                  pullRequest(number: \$number) {
                    reviewThreads(first: 100) {
                      pageInfo { hasNextPage }
                      nodes {
                        isResolved
                        comments(first: 100) {
                          pageInfo { hasNextPage }
                          nodes { author { login } body }
                        }
                      }
                    }
                  }
                }
              }")" || {
                publish_failure "$head_sha" 'Thread reconciliation failed closed' || true
                failed=1
                continue
              }

            truncated="$(jq '
              [.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage,
               (.data.repository.pullRequest.reviewThreads.nodes[].comments.pageInfo.hasNextPage)]
              | any
            ' <<<"$thread_data")"
            unresolved_blocking="$(jq '
              [.data.repository.pullRequest.reviewThreads.nodes[]
                | select(.isResolved | not)
                | select(any(.comments.nodes[]?;
                    ((.author.login // "") | IN("chatgpt-codex-connector", "chatgpt-codex-connector[bot]")) and
                    ((.body // "") | test("\\[(P0|P1)( Badge)?\\]"; "i"))))]
              | length
            ' <<<"$thread_data")"

            if [[ "$truncated" != false ]]; then
              publish_failure "$head_sha" 'Thread reconciliation exceeded audit limit'
              invalidated=$((invalidated + 1))
            elif (( unresolved_blocking > 0 )); then
              publish_failure "$head_sha" 'Unresolved blocking Codex review thread remains'
              invalidated=$((invalidated + 1))
            fi
          done < <(jq -r '
            add[]
            | [.number, .head.sha, (.head.repo.full_name // ""), (.user.login // "")]
            | @tsv
          ' <<<"$pulls")

          printf '### Codex thread reconciliation\n\nInvalidated PR heads: %s\n' \
            "$invalidated" >> "$GITHUB_STEP_SUMMARY"
          (( failed == 0 )) || {
            echo '::error::One or more pull requests could not be reconciled.'
            exit 1
          }
